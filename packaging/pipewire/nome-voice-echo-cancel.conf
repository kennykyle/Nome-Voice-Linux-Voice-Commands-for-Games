# Nome Voice: echo-cancelled microphone.
#
# Runs as its own small PipeWire client (nome-voice-echo-cancel.service), so the
# main PipeWire service never needs a restart. It takes the default microphone and
# removes whatever the default output (speakers or headset) is playing, so game
# audio from speakers can't trigger voice commands. Other apps keep using the
# normal microphone. Remove with:
#   systemctl --user disable --now nome-voice-echo-cancel.service
context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    {   name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    {   name = libpipewire-module-protocol-native }
    {   name = libpipewire-module-client-node }
    {   name = libpipewire-module-adapter }
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # use whatever the default output plays as the echo reference
            monitor.mode = true
            capture.props = {
                node.name = "nome_voice_ec_capture"
                node.description = "Nome Voice echo cancel (microphone in)"
                # only open the mic while something records from the source
                node.passive = true
            }
            sink.props = {
                node.name = "nome_voice_ec_reference"
                node.description = "Nome Voice echo cancel (speaker reference)"
                node.passive = true
            }
            source.props = {
                node.name = "nome_voice_ec_source"
                node.description = "Microphone, echo cancelled (Nome Voice)"
                # never pick this as the system default microphone
                priority.session = 1
            }
        }
    }
]

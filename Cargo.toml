[workspace]
members = [
  "crates/nome-voice-core",
  "crates/nome-voiced"
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
nome-voice-core = { path = "crates/nome-voice-core" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nome-voice"
version = "0.3.0"
description = "GTK frontend for Nome Voice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
dependencies = [
  "evdev>=1.7.0; sys_platform == 'linux'",
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "vosk>=0.3.45"
]

[project.scripts]
nome-voice = "nome_voice.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nome_voice*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
